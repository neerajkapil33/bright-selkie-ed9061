<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neeraj Kapil | AI Career Diagnostic - w3me.in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
.code-bg { background: #0A0F1E; }
.gradient-text { background: linear-gradient(90deg, #22C55E, #00D4FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.glass { background: rgba(22,27,34,0.6); backdrop-filter: blur(12px); border: 1px solid rgba(34,197,94,0.2); }
.option-btn { border: 1px solid rgba(34,197,94,0.3); }.option-btn.selected { border-color: #22C55E; background: rgba(34,197,94,0.1); }
  </style>
</head>
<body class="code-bg text-white font-sans">

  <!-- NAV -->
  <nav class="fixed top-0 w-full glass z-50"><div class="max-w-7xl mx-auto px-6 py-4"><h1 class="text-2xl font-bold gradient-text">w3me.in</h1></div></nav>

  <!-- ASSESSMENT ENGINE -->
  <section id="assessment" class="pt-32 pb-20 px-6">
    <div class="max-w-5xl mx-auto glass rounded-3xl p-10">
      <h2 class="text-4xl font-bold text-center">AI Career Diagnostic by Neeraj</h2>
      <p class="text-gray-400 text-center mt-2">4 steps. Get Scorecard + AI Action Plan + Certification Path</p>

      <!-- STEP 1: PROFILE BUILDER -->
      <div id="profileStep">
        <h3 class="text-xl font-bold mt-8">Step 1: Build Your Profile</h3>
        <div class="grid md:grid-cols-2 gap-4 mt-4">
          <select id="function" class="bg-[#0A0F1E] border-green-400/30 rounded-lg p-3" onchange="loadIndustries()">
            <option value="">Select Function</option>
            <option>Technology</option><option>Sales</option><option>Marketing</option><option>Finance</option><option>HR</option><option>Operations</option><option>Leadership</option>
          </select>
          <select id="industry" class="bg-[#0A0F1E] border-green-400/30 rounded-lg p-3">
            <option value="">Select Industry</option>
          </select>
          <select id="region" class="bg-[#0A0F1E] border-green-400/30 rounded-lg p-3">
            <option value="">Select Region</option>
            <option>India</option><option>Middle East</option><option>US/UK</option><option>APAC</option><option>Global Remote</option>
          </select>
          <select id="experience" class="bg-[#0A0F1E] border-green-400/30 rounded-lg p-3">
            <option value="">Experience Level</option>
            <option>0-2 Years</option><option>3-5 Years</option><option>6-10 Years</option><option>10+ Years</option><option>CXO</option>
          </select>
        </div>
        <input id="skills" placeholder="Top 3 Skills: e.g. Python, Sales, Leadership" class="w-full bg-[#0A0F1E] border-green-400/30 rounded-lg p-3 mt-4">
        <button onclick="startAssessment()" class="mt-6 w-full bg-gradient-to-r from-green-500 to-cyan-500 text-black py-4 rounded-full font-bold">Start Diagnostic</button>
      </div>

      <!-- STEP 2: QUESTIONNAIRE -->
      <div id="quizStep" class="hidden">
        <div id="progress" class="text-sm text-gray-400 mb-4"></div>
        <div id="questionBox"></div>
        <button onclick="nextQ()" class="mt-6 bg-gradient-to-r from-green-500 to-cyan-500 text-black px-8 py-3 rounded-full font-bold">Next</button>
      </div>

      <!-- STEP 3: REPORT -->
      <div id="reportStep" class="hidden">
        <h3 class="text-3xl font-bold gradient-text">Your Career Health Report</h3>
        <div id="reportContent" class="mt-6 space-y-4"></div>
        <button onclick="location.reload()" class="mt-6 glass px-6 py-3 rounded-full">Retake</button>
      </div>
    </div>
  </section>

  <!-- FLOATING AI AGENT -->
  <div id="neeraj-avatar" class="fixed bottom-6 right-6 cursor-pointer" onclick="playVoice('')">
    <div id="bubble" class="glass p-4 rounded-2xl rounded-br-none shadow-2xl max-w-xs hidden"><p class="text-sm" id="bubbleText"></p></div>
    <img src="neeraj-original.jpg" class="w-20 h-20 rounded-full border-4 border-green-400"/>
    <audio id="voice" src="neeraj-welcome.ogg"></audio>
  </div>

<script>
// QUESTION BANK - YOU CAN ADD 100s HERE
const questionBank = {
  "Technology_0-2 Years": [
    {q: "How strong is your DSA/Coding?", opts: ["Beginner", "Intermediate", "Advanced", "FAANG Level"], impact: {Beginner:-2, Intermediate:0, Advanced:2, "FAANG Level":3}},
    {q: "Biggest challenge right now?", opts: ["No interviews", "System Design", "Portfolio", "Imposter Syndrome"], type: "challenge"}
  ],
  "Sales_3-5 Years": [
    {q: "Rate your pipeline management", opts: ["Weak", "Average", "Strong", "CRM Expert"], impact: {Weak:-2, Average:0, Strong:2, "CRM Expert":3}},
    {q: "Current challenge?", opts: ["Quota Pressure", "Lead Quality", "Peer Competition", "Burnout"], type: "challenge"}
  ],
  "Leadership_10+ Years": [
    {q: "P&L Responsibility?", opts: ["None", "<1Cr", "1-10Cr", "10Cr+"], impact: {None:-1, "<1Cr":1, "1-10Cr":2, "10Cr+":3}},
    {q: "Biggest org challenge?", opts: ["Team Attrition", "Strategy Execution", "Board Pressure", "Burnout/Depression"], type: "challenge"}
  ]
};
let currentQuestions = []; let answers = []; let qIndex = 0; let score = 70;

function loadIndustries() {
  const func = document.getElementById('function').value;
  const ind = document.getElementById('industry');
  const map = {Technology:["SaaS","Fintech","IT Services"], Sales:["B2B SaaS","FMCG","Real Estate"], Leadership:["All Industries"]};
  ind.innerHTML = '<option value="">Select Industry</option>';
  (map[func]||[]).forEach(i=>ind.innerHTML += `<option>${i}</option>`);
}

function startAssessment() {
  const func = document.getElementById('function').value;
  const exp = document.getElementById('experience').value;
  const key = func + "_" + exp;
  currentQuestions = questionBank[key] || questionBank["Technology_0-2 Years"]; // fallback

  document.getElementById('profileStep').classList.add('hidden');
  document.getElementById('quizStep').classList.remove('hidden');
  playVoice("Got your profile. Let's start the diagnostic for " + func);
  showQ();
}

function showQ() {
  const q = currentQuestions[qIndex];
  document.getElementById('progress').innerText = `Question ${qIndex+1} of ${currentQuestions.length}`;
  let optsHTML = q.opts.map((o,i)=>`<button onclick="selectOpt(this,'${o}')" class="option-btn w-full text-left p-4 rounded-xl mb-2">${o}</button>`).join('');
  document.getElementById('questionBox').innerHTML = `<h3 class="text-2xl font-bold">${q.q}</h3><div class="mt-4">${optsHTML}</div>`;
}

function selectOpt(btn, val) {
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[qIndex] = val;
}

function nextQ() {
  if(!answers[qIndex]) return alert("Please select an option");
  const q = currentQuestions[qIndex];
  if(q.impact) score += q.impact[answers[qIndex]] * 5;
  if(q.type=="challenge") answers[qIndex+"_challenge"] = answers[qIndex];

  qIndex++;
  if(qIndex < currentQuestions.length) showQ();
  else generateReport();
}

function generateReport() {
  document.getElementById('quizStep').classList.add('hidden');
  document.getElementById('reportStep').classList.remove('hidden');

  const challenge = answers["1_challenge"] || "Career Growth";
  const strengths = score > 75? "Execution, Communication" : "Potential, Learning Agility";
  const gaps = score < 70? "Skill Certification, Interview Prep" : "Leadership Exposure";

  let solution = "";
  if(challenge.includes("Burnout")) solution = "1. 30-Day Reset Plan 2. Therapy + Coaching 3. Delegation Framework";
  if(challenge.includes("Quota")) solution = "1. LinkedIn Outreach System 2. Discovery Call Script 3. Coursera: Sales Negotiation";

  document.getElementById('reportContent').innerHTML = `
    <div class="glass p-6 rounded-2xl text-center"><h4 class="text-5xl font-bold gradient-text">${score}/100</h4><p>Career Health Score</p></div>
    <div class="glass p-4 rounded-xl"><b>Strengths:</b> ${strengths}</div>
    <div class="glass p-4 rounded-xl"><b>Gaps:</b> ${gaps}</div>
    <div class="glass p-4 rounded-xl"><b>Main Challenge Identified:</b> ${challenge}</div>
    <div class="glass p-4 rounded-xl"><b>AI Neeraj 90-Day Plan:</b> ${solution}
      <br><b>Recommended:</b> <a href="https://coursera.org" target="_blank" class="text-cyan-400">Coursera Cert</a> | <a href="https://linkedin.com/learning" target="_blank" class="text-cyan-400">LinkedIn Learning</a>
    </div>
  `;
  playVoice(`Your score is ${score}. Main gap is ${gaps}. Start with this 90 day plan.`);
}

function playVoice(text) {
  if(text) document.getElementById('bubbleText').innerText = text;
  document.getElementById('bubble').classList.remove('hidden');
  document.getElementById('voice').play().catch(()=>{});
  setTimeout(()=>document.getElementById('bubble').classList.add('hidden'), 6000);
}
</script>
</body>
</html>
