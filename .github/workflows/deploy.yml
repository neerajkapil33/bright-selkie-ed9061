name: Build site, validate SEO, and deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Validate production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/neeraj-kapil/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          grep -q 'rel="canonical"' dist/index.html
          grep -q '"@type":"Person"' dist/index.html
          grep -q '"@type":"ProfilePage"' dist/index.html
          grep -q 'https://www.linkedin.com/in/neeraj-kapil' dist/neeraj-kapil/index.html
          grep -q 'https://github.com/neerajkapil33' dist/neeraj-kapil/index.html
          grep -q '<loc>https://w3me.in/neeraj-kapil/</loc>' dist/sitemap.xml
          grep -q 'Sitemap: https://w3me.in/sitemap.xml' dist/robots.txt
          echo "Production SEO validation passed."

      - name: Write runtime API config for frontend
        run: |
          echo "window.__API_BASE__ = 'https://w3me.in';" > dist/api-config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
